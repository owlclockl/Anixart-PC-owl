name: Build AniDesk

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        # macos-latest can be added if you have Apple cert
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # cache: 'npm' здесь нельзя: package-lock.json лежит в .gitignore,
      # а без лок-файла шаг setup-node падает с ошибкой
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # deb и rpm мейкеры Electron Forge без этих утилит не работают
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Vite
        run: npm run build

      # Для подписи кода под Windows добавьте сюда env с секретом сертификата:
      #   env:
      #     WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      - name: Make (Electron Forge)
        run: npm run make

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anidesk-${{ matrix.os }}-${{ github.sha }}
          path: |
            out/make/**/*
            !out/make/**/node_modules
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
